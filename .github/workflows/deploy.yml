name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deployment finish; queue the next one instead of cancelling it.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy from the original repository, not from candidate forks or template copies.
    if: github.repository == 'NChapron-sic/frontend-architecture-challenge'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      BUILD_DIR: dist/operations-console/browser

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: |
          npm run lint
          npm test

      - name: Build
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"

      - name: Prepare Pages files
        run: |
          test -f "$BUILD_DIR/index.html"
          touch "$BUILD_DIR/.nojekyll"
          cp "$BUILD_DIR/index.html" "$BUILD_DIR/404.html"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
